name: Promote next to main

# Ships `next` to `main` as a merge commit, run from the Actions tab: it snapshots `next`,
# opens a PR and enables auto-merge, and CI gates it.
#
# The merge commit does two jobs. It carries every conventional commit onto `main` untouched,
# so release-please attributes each one to a package by the path it touched — a squash hides
# that. And its two parents give the branches a real merge base, which a rebase never
# records: without one the base goes stale, and every later back-merge conflicts on the
# release metadata release-please rewrites each cycle.

on:
  workflow_dispatch:

concurrency:
  group: promote
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    name: Open and merge next into main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.AIDD_BOT_APP_ID }}
          private-key: ${{ secrets.AIDD_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Open the promote PR, enable merge auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          git config user.name "aidd-bot[bot]"
          git config user.email "aidd-bot[bot]@users.noreply.github.com"
          git fetch origin main next --prune

          # Trees, not ancestry: after a back-merge, next's tip is a merge commit main does
          # not carry, so identical content still reads as unmerged and opens an empty PR.
          if [ "$(git rev-parse origin/next^{tree})" = "$(git rev-parse origin/main^{tree})" ]; then
            echo "next and main already hold the same tree; nothing to promote."
            exit 0
          fi

          # A snapshot of next, never next itself: a PR headed by the live branch widens as
          # work merges in during review. The snapshot is next's exact tip, so the merge base
          # still refreshes.
          BRANCH="promote/next-to-main-${RUN_ID}"
          git push origin "origin/next:refs/heads/${BRANCH}"

          PR=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "ci: promote next to main" \
            --body "Automated promotion of \`next\` to \`main\`, from a snapshot of next taken at run ${RUN_ID}. Merged as a **merge commit** so \`main\` keeps every conventional commit for release-please, and so both branches keep a shared merge base for the back-merge. Do not squash, do not rebase." \
            | grep -oE '[0-9]+$')
          echo "Promote PR: #$PR"

          # `ci:` on purpose: the type is absent from release-please's changelog-sections,
          # so this plumbing commit never surfaces in a changelog, and commitlint accepts it.
          gh pr merge "$PR" --repo "$REPO" --merge --auto --delete-branch \
            --subject "ci: promote next to main (#${PR})"

          # Without a recorded subject GitHub generates one that is not conventional, and
          # commitlint lints main's tip on push.
          gh pr view "$PR" --repo "$REPO" --json autoMergeRequest \
            --jq '.autoMergeRequest.commitHeadline // empty' | grep -q . || {
            echo "Auto-merge did not record the commit subject; refusing to leave main's tip to chance."
            exit 1
          }
