name: Close finished milestones

# GitHub has no native rule for closing a milestone whose last issue closed, so its due date
# keeps reading as "overdue". An empty milestone is left alone: a fresh bucket, not finished
# work. Reopening one by hand is safe, since only a milestone with no open issue is touched.

on:
  issues:
    types: [closed]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: close-finished-milestones
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  close-finished-milestones:
    name: Close milestones with no open issues
    runs-on: ubuntu-latest
    steps:
      - name: Close finished milestones
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/milestones?state=open&per_page=100" \
            --jq '.[] | select(.closed_issues > 0 and .open_issues == 0) | "\(.number)\t\(.title)"' \
            > finished.tsv

          if [ ! -s finished.tsv ]; then
            echo "No finished milestone to close."
            exit 0
          fi

          while IFS=$'\t' read -r number title; do
            echo "Closing milestone #$number ($title)"
            gh api -X PATCH "repos/$REPO/milestones/$number" -f state=closed >/dev/null
          done < finished.tsv
