name: cli CI

# Native path-filtered isolation: this whole workflow is skipped when nothing
# under cli/ or kanban/ changed — no third-party paths-filter action needed.
#
# kanban/ is a source folder the CLI type-checks and bundles, not a published
# package. Any job that runs a TypeScript-aware tool over the CLI's program must
# install kanban's dependencies too, or module resolution fails from its sources.

on:
  push:
    branches: [main, next]
    paths:
      - "cli/**"
      - "kanban/**"
  pull_request:
    paths:
      - "cli/**"
      - "kanban/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  cli-typecheck:
    name: cli / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm typecheck

  cli-lint:
    name: cli / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm lint

  cli-architecture:
    name: cli / Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm test:arch

  cli-test:
    name: cli / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install expect (TTY persona tests)
        run: sudo apt-get update && sudo apt-get install -y expect
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm test

  cli-smoke:
    name: cli / Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd cli && pnpm install --frozen-lockfile
      # Hermetic: every setup uses the local framework fixture, so this needs no
      # token and no network. `smoke:full` adds the remote-fetch section on demand.
      - run: cd cli && pnpm smoke

  cli-build:
    name: cli / Build & Bundle Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm build

  cli-knip:
    name: cli / Knip (dead code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm knip:production

  cli-jscpd:
    name: cli / JSCPD (duplication)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm jscpd

  kanban-checks:
    name: kanban / Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd kanban && pnpm typecheck
      - run: cd kanban && pnpm lint
      - run: cd kanban && pnpm test
