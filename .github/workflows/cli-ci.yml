name: cli CI

# Native path-filtered isolation: this whole workflow is skipped when nothing
# under cli/ or kanban/ changed — no third-party paths-filter action needed.
#
# kanban/ is a source folder the CLI type-checks and bundles, not a published
# package. Any job that runs a TypeScript-aware tool over the CLI's program must
# install kanban's dependencies too, or module resolution fails from its sources.

on:
  push:
    branches: [main, next]
    paths:
      - "cli/**"
      - "kanban/**"
  pull_request:
    paths:
      - "cli/**"
      - "kanban/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  cli-typecheck:
    name: cli / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm typecheck

  cli-lint:
    name: cli / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm lint

  cli-test:
    name: cli / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install expect (TTY persona tests)
        run: sudo apt-get update && sudo apt-get install -y expect
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm test

  cli-build:
    name: cli / Build & Bundle Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm build

  cli-knip:
    name: cli / Knip (dead code)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm knip:production

  cli-jscpd:
    name: cli / JSCPD (duplication)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd cli && pnpm install --frozen-lockfile
      - run: cd cli && pnpm jscpd

  kanban-checks:
    name: kanban / Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd kanban && pnpm typecheck
      - run: cd kanban && pnpm lint
      - run: cd kanban && pnpm test

  windows-probe:
    # Answers issue #707's Windows half: nothing in the telemetry layer had ever run on
    # Windows. Runs under bash (Git Bash, bundled on windows-latest) so every command below
    # is the same command the Linux measurements in
    # aidd_docs/tasks/2026_08/2026_08_22_platforms/measurements.md ran, not a PowerShell
    # rewrite of it.
    name: cli / Windows Probe (#707)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Answers and the round trip run before the suites below, and each has its own
      # continue-on-error: this job exists to gather every finding in one pass, not to stop
      # at the first red step - the final "Fail the job..." step below restores an accurate
      # pass/fail conclusion from what actually happened.

      - name: '#707 answer 1 - where the figures land'
        id: answer1
        continue-on-error: true
        run: |
          node <<'EOF'
          const os = require("node:os");
          const path = require("node:path");
          console.log("HOME=" + JSON.stringify(process.env.HOME));
          console.log("USERPROFILE=" + JSON.stringify(process.env.USERPROFILE));
          console.log("APPDATA=" + JSON.stringify(process.env.APPDATA));
          console.log("os.homedir()=" + os.homedir());
          const sinkPath = path.resolve("plugins/aidd-telemetry/skills/01-cost/scripts/lib/sink.js");
          console.log("resolved rootDir(), runner's own HOME=" + require(sinkPath).rootDir());
          delete process.env.HOME;
          delete require.cache[require.resolve(sinkPath)];
          console.log("resolved rootDir(), HOME unset (a real Windows machine)=" + require(sinkPath).rootDir());
          EOF

      - name: '#707 answer 2 - what POSIX modes actually do'
        id: answer2
        continue-on-error: true
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const os = require("node:os");
          const dir = path.join(os.tmpdir(), "aidd-mode-probe-" + Date.now());
          let dirErr = null, fileErr = null, chmodErr = null;
          try { fs.mkdirSync(dir, { recursive: true, mode: 0o700 }); } catch (e) { dirErr = e.message; }
          const file = path.join(dir, "probe.jsonl");
          try { fs.appendFileSync(file, "{}\n", { mode: 0o600 }); } catch (e) { fileErr = e.message; }
          try { fs.chmodSync(dir, 0o700); } catch (e) { chmodErr = e.message; }
          const dirMode = (fs.statSync(dir).mode & 0o777).toString(8);
          const fileMode = (fs.statSync(file).mode & 0o777).toString(8);
          console.log("platform=" + process.platform);
          console.log("mkdirSync({mode:0o700}) threw=" + dirErr);
          console.log("appendFileSync({mode:0o600}) threw=" + fileErr);
          console.log("chmodSync(dir,0o700) threw=" + chmodErr);
          console.log("directory mode on disk=0" + dirMode + " (repo.js asked for 0700)");
          console.log("file mode on disk=0" + fileMode + " (sink.js/record.js asked for 0600)");
          EOF

      - name: '#707 answer 3 - the script search line exactly as 01-locate.md writes it, under bash'
        id: answer3bash
        continue-on-error: true
        run: |
          find ~/.claude/plugins ~/.codex/plugins ~/.cursor/plugins .github/plugins .claude/plugins .codex/plugins . \
            -type f -path '*01-cost/scripts/telemetry-report.js' 2>&1
          echo "exit code: ${PIPESTATUS[0]}"

      - name: '#707 answer 3 - the identical line under pwsh (what a PowerShell user gets)'
        id: answer3pwsh
        continue-on-error: true
        shell: pwsh
        run: |
          find ~/.claude/plugins ~/.codex/plugins ~/.cursor/plugins .github/plugins .claude/plugins .codex/plugins . -type f -path '*01-cost/scripts/telemetry-report.js' 2>&1
          Write-Output "exit code: $LASTEXITCODE"

      - name: Round trip - switch telemetry on
        id: rt1
        continue-on-error: true
        run: node plugins/aidd-telemetry/skills/00-init/scripts/telemetry-switch.js on

      - name: Round trip - journal a captured payload
        id: rt2
        continue-on-error: true
        run: |
          # The fixture's own cwd is a path from whatever machine captured it - rewritten to
          # this checkout's real path, the same edit the Linux measurements made, so
          # getRepoRoot resolves a repository that actually exists on this runner.
          node -e "const p=require('./scripts/__tests__/fixtures/claude-code-session-start.json'); p.cwd=process.cwd(); require('fs').writeFileSync('payload.json', JSON.stringify(p));"
          node plugins/aidd-telemetry/hooks/journal.js session-start < payload.json
          node plugins/aidd-telemetry/hooks/journal.js turn-end < payload.json
          find aidd_docs/runs -type f | xargs -I{} cat {}

      - name: Round trip - read it back
        id: rt3
        continue-on-error: true
        run: |
          node plugins/aidd-telemetry/skills/01-cost/scripts/telemetry-report.js read
          node plugins/aidd-telemetry/skills/01-cost/scripts/telemetry-report.js report

      - name: Round trip - telemetry-check.js
        id: rt4
        continue-on-error: true
        run: node plugins/aidd-telemetry/skills/02-check/scripts/telemetry-check.js

      - name: Plugin's own suite
        id: pluginsuite
        continue-on-error: true
        run: node --test "scripts/__tests__/*.test.js"

      - run: cd kanban && pnpm install --frozen-lockfile
      - run: cd cli && pnpm install --frozen-lockfile
      - name: cli unit
        id: cliunit
        continue-on-error: true
        run: cd cli && pnpm test:unit
      - name: cli integration
        id: cliintegration
        continue-on-error: true
        run: cd cli && pnpm test:integration
      - name: cli e2e (excluding two Windows-infeasible files, by name)
        id: clie2e
        continue-on-error: true
        run: |
          cd cli
          pnpm build
          pnpm exec vitest run --project=e2e \
            --exclude "tests/e2e/persona.e2e.test.ts" \
            --exclude "tests/e2e/telemetry-multi-tool.e2e.test.ts"
        # persona.e2e.test.ts: hardcodes /usr/bin/expect for TTY emulation - that path and
        # binary do not exist on windows-latest.
        # telemetry-multi-tool.e2e.test.ts: writes a `#!/bin/sh` stand-in `opencode` binary
        # (chmod 0o755, no file extension) and puts it on PATH. Windows resolves an
        # executable by PATHEXT/extension, not a shebang line or the POSIX execute bit, so
        # this stand-in never launches there.

      - name: Fail the job if any real step above failed
        if: always()
        run: |
          for outcome in \
            "${{ steps.answer1.outcome }}" "${{ steps.answer2.outcome }}" \
            "${{ steps.answer3bash.outcome }}" "${{ steps.answer3pwsh.outcome }}" \
            "${{ steps.rt1.outcome }}" "${{ steps.rt2.outcome }}" "${{ steps.rt3.outcome }}" "${{ steps.rt4.outcome }}" \
            "${{ steps.pluginsuite.outcome }}" \
            "${{ steps.cliunit.outcome }}" "${{ steps.cliintegration.outcome }}" "${{ steps.clie2e.outcome }}"; do
            if [ "$outcome" = "failure" ]; then
              echo "at least one probe step failed - see above"
              exit 1
            fi
          done
          echo "every probe step passed"
