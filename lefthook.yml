pre-commit:
  output: true
  commands:
    json-validity:
      glob: "**/*.json"
      exclude:
        - "cli/tests/fixtures/**"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo "❌ node not available; cannot validate JSON"
          exit 1
        fi
        node scripts/validate-json.mjs {files}
    yaml-validity:
      glob: "**/*.{yml,yaml}"
      exclude:
        - "plugins/*/skills/*/assets/**"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo "❌ node not available; cannot validate YAML"
          exit 1
        fi
        node scripts/validate-yaml.mjs {files}
    scripts-tests:
      glob: "{scripts,plugins/aidd-context/hooks}/**"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo "ℹ️  node not available; skipping scripts-tests"
          exit 0
        fi
        # Wrapped, because a suite that writes into this repository's own .git/hooks passes
        # every assertion and destroys an install nothing can restore — `.git` is in no
        # history. The wrapper passes the suite's own exit code through untouched.
        node scripts/check-tests-leave-git-alone.js -- \
          node --test 'scripts/__tests__/*.test.js'
    skill-frontmatter:
      glob: "plugins/*/skills/*/SKILL.md"
      run: |
        for f in {files}; do
          [ -f "$f" ] || continue
          if ! head -10 "$f" | grep -q "^name:"; then
            echo "❌ missing 'name:' frontmatter: $f"
            exit 1
          fi
          if ! head -10 "$f" | grep -q "^description:"; then
            echo "❌ missing 'description:' frontmatter: $f"
            exit 1
          fi
        done
    check-skill-argument-hints:
      glob: "plugins/*/skills/**"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo "ℹ️  node not available; skipping check-skill-argument-hints"
          exit 0
        fi
        node scripts/check-skill-argument-hints.mjs
    context-imports:
      # Two patterns, because "**/" needs a literal slash and so never matches
      # a file at the repository root.
      glob:
        - "{CLAUDE,AGENTS,copilot-instructions}.md"
        - "**/{CLAUDE,AGENTS,copilot-instructions}.md"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo "ℹ️  node not available; skipping context-imports"
          exit 0
        fi
        node scripts/check-context-imports.js
    context-reference-form:
      # The whole repository's answer, not the staged files': the hook rewrites
      # every target at once, so a partial view could call one file clean while
      # its sibling drifted in the same session.
      glob:
        - "{CLAUDE,AGENTS,copilot-instructions}.md"
        - "**/{CLAUDE,AGENTS,copilot-instructions}.md"
        - "plugins/aidd-context/hooks/update_memory.js"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo "ℹ️  node not available; skipping context-reference-form"
          exit 0
        fi
        node scripts/check-context-reference-form.js
    markdown-links:
      glob: "**/*.md"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo "ℹ️  node not available; skipping markdown-links"
          exit 0
        fi
        # TEMPORARY (aidd-cli -> framework migration, phase 1): cli's own
        # historical archives were never link-checked before landing here —
        # 704 pre-existing, unrelated broken "links" (test fixtures with
        # intentionally fake paths, old task docs using @src/foo.ts as an
        # agent-mention shorthand, not a markdown link). See the migration
        # plan's final phase for the follow-up that fixes the real links and
        # removes these two --ignore flags.
        node scripts/check-markdown-links.js --ignore cli/tests/fixtures --ignore cli/aidd_docs/tasks
    summarize-plugin-catalogs:
      run: |
        [ -d plugins ] || exit 0
        if ! command -v node >/dev/null 2>&1; then
          echo "ℹ️  node not available; skipping summarize-plugin-catalogs"
          exit 0
        fi
        for plugin in plugins/*/; do
          name=$(basename "$plugin")
          node scripts/summarize-markdown.js "$plugin" "${plugin}CATALOG.md" \
            --depth=4 \
            --fields=description \
            --title="$name catalog" \
            --tagline="Auto-generated index of skills, agents, references and assets shipped by the \`$name\` plugin." \
            >/dev/null
          git add "${plugin}CATALOG.md" 2>/dev/null || true
        done
    summarize-telemetry-prompts-doc:
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo "ℹ️  node not available; skipping summarize-telemetry-prompts-doc"
          exit 0
        fi
        node scripts/summarize-markdown.js plugins/aidd-telemetry docs/prompts-documentation.md \
          --depth=3 \
          --fields=description \
          >/dev/null
        git add docs/prompts-documentation.md 2>/dev/null || true
    sync-readme-counts:
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo "ℹ️  node not available; skipping sync-readme-counts"
          exit 0
        fi
        node scripts/sync-readme-counts.mjs >/dev/null
        git add README.md 2>/dev/null || true
    scripts-test:
      glob: "{scripts,plugins}/**"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo "ℹ️  node not available; skipping scripts-test"
          exit 0
        fi
        # `node --test <dir>` treats the directory as a module path and fails, so
        # the glob is required. A glob that matches nothing exits 0 in silence,
        # which would make a renamed folder read as a green run — count first.
        found=$(ls scripts/__tests__/*.test.js 2>/dev/null | wc -l | tr -d ' ')
        if [ "$found" -eq 0 ]; then
          echo "❌ no test files under scripts/__tests__/; the runner is not wired"
          exit 1
        fi
        node --test "scripts/__tests__/**/*.test.js"
    cli-biome:
      glob: "cli/**"
      run: cd cli && pnpm lint
    cli-layering:
      # The two invariants biome cannot express: dependencies point inward, and no type is
      # widened through `unknown` or `never`. Measured, not assumed — a noRestrictedImports
      # rule written against "../../infrastructure" never fired on a violation planted in
      # src/domain. The glob covers `cli/**`, not `cli/src/**`: the cast half of the check
      # reads `cli/tests` too, and a test-only commit must not slip past it.
      glob: "cli/**"
      run: node scripts/check-cli-layering.mjs
    cli-typecheck:
      # The CLI type-checks `kanban/` too, so that folder's dependencies must be
      # resolvable. Install them only when they are missing, to keep the hook fast.
      #
      # `--ignore-workspace` was here so pnpm would not resolve kanban to the
      # repository root, find it lists no members, report "Already up to date" and
      # install nothing. `kanban/pnpm-workspace.yaml` now stops that upward search on
      # its own — that is the whole reason the file exists — and the flag had turned
      # harmful: it discards that same file, and with it the `allowBuilds` entry pnpm
      # needs to run esbuild's install script. Measured in the real layout under
      # pnpm 12.3.4, a root workspace above and kanban's own file present: without the
      # flag the install exits 0, with it, ERR_PNPM_IGNORED_BUILDS.
      glob: "{cli,kanban}/**"
      run: |
        [ -d kanban/node_modules ] || (cd kanban && pnpm install --frozen-lockfile)
        cd cli && pnpm typecheck

pre-push:
  commands:
    cli-knip:
      glob: "cli/**"
      run: cd cli && pnpm knip:production
    cli-test:
      glob: "cli/**"
      run: cd cli && pnpm test

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
