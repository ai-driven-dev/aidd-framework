<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aidd kanban</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="header">
    <div class="header-left">
      <h1>aidd kanban</h1>
      <span id="project-path" class="dimmed"></span>
    </div>
    <div class="header-right">
      <span id="connection-dot" class="dot dot-disconnected"></span>
      <span id="connection-label" class="dimmed">disconnected</span>
    </div>
  </header>

  <main id="board"></main>

  <div id="panel-overlay" class="panel-overlay">
    <aside id="panel" class="panel">
      <div class="panel-header">
        <h2 id="panel-title"></h2>
        <button id="panel-close" class="panel-close" type="button">&times;</button>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </aside>
  </div>

  <footer id="footer">
    <span id="task-count" class="dimmed"></span>
    <span id="last-update" class="dimmed"></span>
  </footer>

  <script src="/app.js" defer></script>
</body>
</html>
